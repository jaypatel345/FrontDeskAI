name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (src/db.js) needs Node 22.13+; 24 is the current LTS.
          node-version: 24
          cache: npm
      - run: npm ci
      # Tests force every integration into mock mode (see test/setup.js), so no secrets are needed here.
      - run: npm test
